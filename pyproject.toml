[project]
name = "enterprise-knowledge-base"
version = "0.1.0"
description = "Independent, permission-aware knowledge retrieval and evaluation"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.128,<1", "pydantic>=2.10,<3", "httpx>=0.28,<1", "uvicorn>=0.34,<1"]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --basetemp=.cache/pytest"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
